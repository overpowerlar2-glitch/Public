# One-command trial:  docker compose up --build   then open http://localhost:3000
# Confirmation emails are caught by Mailpit and shown at http://localhost:8025 (nothing is really sent).
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tabiya, POSTGRES_PASSWORD: tabiya, POSTGRES_DB: tabiya }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tabiya"], interval: 2s, timeout: 3s, retries: 30 }

  mail:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  app:
    build: { context: ., args: { STOCKFISH: "${STOCKFISH:-1}" } }
    depends_on: { db: { condition: service_healthy }, mail: { condition: service_started } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://tabiya:tabiya@db:5432/tabiya
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Open to everyone by default, including anonymous play. Set e.g. ALLOWED_EMAIL_DOMAINS=totersapp.com to make it private.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      # Real mail server for production, e.g. smtps://user:pass@smtp.example.com. Defaults to the local Mailpit.
      SMTP_URL: ${SMTP_URL:-smtp://mail:1025}
      MAIL_FROM: ${MAIL_FROM:-Tabiya <no-reply@localhost>}
    restart: unless-stopped

volumes:
  db:
